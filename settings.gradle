pluginManagement {
    // Loom 1.11.x (the 1.21.8-era loom that still remaps obfuscated Minecraft to Mojang
    // names) predates the plugin-marker convention, so resolve the plugin id straight to
    // the library artifact.
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'fabric-loom') {
                useModule("net.fabricmc:fabric-loom:${requested.version}")
            }
        }
    }
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'lonsdaleite'

include 'common'
include 'fabric'
include 'neoforge'
