plugins {
    id 'java'
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'maven-publish'

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(25)
        withSourcesJar()
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }

    repositories {
        maven { name = 'Fabric';        url = 'https://maven.fabricmc.net/' }
        maven { name = 'NeoForged';     url = 'https://maven.neoforged.net/releases' }
        // No dependency resolves from maven.terraformersmc.com or maven.shedaniel.me, so both are
        // deliberately absent rather than merely unused: Gradle contacts every declared repository in
        // order on a resolution miss, and terraformersmc has a history of serving truncated bodies for
        // large jars (HTTP 200, then a premature end of the chunked response) — which fails the build
        // for a dependency it does not even host. Do not re-add a repository without a coordinate that
        // actually resolves from it.
        mavenCentral()
    }
}

allprojects {
    version = project.mod_version
    group = project.maven_group
}

tasks.register('buildAll') {
    dependsOn ':fabric:build', ':neoforge:build'
    description = 'Builds both Fabric and NeoForge versions.'
}
